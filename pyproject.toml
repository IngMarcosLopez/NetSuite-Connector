[build-system]
requires = ["setuptools>=61.0","requests>=2.27.1","requests-oauthlib>=1.3.1","pyodbc>=4.0.34","pandas>=1.5.0"]
build-backend = "setuptools.build_meta"

[project]
name = "NetSuite-Connector"
version = "0.4.0"
authors = [
  { name="Marcos Lopez", email="merick16@gmail.com" },
]
description = "NetSuite Connector"
readme = "README.md"
license = { file="LICENSE" }
requires-python = ">=3.11,<4.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/IngMarcosLopez/NetSuite-Connector"
"Bug Tracker" = "https://github.com/IngMarcosLopez/NetSuite-Connector/issues"

[tool.poetry.dependencies]
setuptools = "^80.9.0"
requests = "^2.32.4"
requests-oauthlib = "^2.0.0"
pandas = "^2.3.1"
cryptography = "^45.0.5"

[tool.poetry.group.test-and-linter.dependencies]
pytest = "^8.4.1"
pre-commit = "^4.2.0"
pylint = "^3.3.7"
flake8 = "^7.3.0"

[tool.poetry.group.release.dependencies]
build = "^1.2.2.post1"
twine = "^6.1.0"
